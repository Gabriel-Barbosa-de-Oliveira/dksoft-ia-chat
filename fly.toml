# fly.toml app configuration file generated for dksoft-ia-chat-api-demo on 2026-10-31T20:08:03-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dksoft-ia-chat-api-demo'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  BASE_URL = 'https://dkapi.dksoft.com.br/api/v1'
  CHAT_DB = '/data/chat.db'
  PORT = '3000'
  TRUST_PROXY = 'true'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
